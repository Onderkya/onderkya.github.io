<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E0F11">
<title>Tiga Kuaför · Şirinyalı</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://assets.mixkit.co">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="https://assets.mixkit.co/videos/271/271-thumb-720-0.jpg">
<link rel="preconnect" href="https://videos.pexels.com"><link rel="preconnect" href="https://images.pexels.com">

<style>
:root{--k-bg:#F4ECE2;--k-fg:#2A1F18;--k-muted:#6E5E50;--k-surface:#FFF9F2;--k-line:#E2D3C1;--k-acc:#2A1F18;--k-acc-fg:#F4ECE2;--silver:linear-gradient(135deg,#F6E7C8 0%,#C9A063 38%,#F3DDAE 55%,#9A7340 100%);--k-font:'Onest',system-ui,sans-serif;--k-display:'Prata',Georgia,serif;--k-dock-bg:rgba(244,236,226,.92);--k-btn-radius:4px;--ease:cubic-bezier(.16,1,.3,1)}
[data-theme=dark]{--k-bg:#1F1814;--k-fg:#F3EAE0;--k-muted:#BBA99A;--k-surface:#2A211C;--k-line:#3D3129;--k-acc:#F3EAE0;--k-acc-fg:#1F1814;--k-dock-bg:rgba(31,24,20,.92)}
::selection{background:#B9BEC5;color:#0E0F11}
.wrap{width:min(1200px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--k-display);font-weight:400;margin:0;letter-spacing:-.01em}
.silver{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn-silver{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 24px;border-radius:4px;border:0;background:var(--silver);color:#0E0F11;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 10px 30px -12px rgba(185,190,197,.6)}
.btn-line{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:4px;border:1px solid currentColor;background:transparent;color:inherit;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none}
/* ===== hero video ===== */
.hero{position:relative;min-height:100svh;color:#ECEDEF;display:flex;flex-direction:column;isolation:isolate;overflow:hidden;background:#0E0F11}
/* yüz anatomisi: önceden çıkarılmış yüz noktalarıyla çizgiler (face-track.js) */
.anat{position:absolute;inset:0;z-index:-2;background:#070708;overflow:hidden}
.anat video{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;filter:contrast(1.18) saturate(.8) brightness(.78);opacity:0;transition:opacity 1.2s var(--ease)}
.anat video.on{opacity:1}
.anat svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.anat__vig{position:absolute;inset:0;background:radial-gradient(70% 75% at 50% 44%,transparent 30%,rgba(0,0,0,.82))}
.anat .ln{fill:none;stroke:#F2EEE6;stroke-width:1.6;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,236,200,.55))}
.anat .gd{fill:none;stroke:rgba(242,238,230,.22);stroke-width:1;stroke-dasharray:3 6}
.anat .dt{fill:#F2EEE6;filter:drop-shadow(0 0 5px rgba(255,236,200,.9))}
.anat text{fill:#F2EEE6;font:600 13px var(--k-font);paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px;letter-spacing:.02em}
.pole3d{position:absolute;right:0;top:40px;width:110px;height:300px;pointer-events:none;z-index:1}
@media(min-width:900px){.pole3d{right:3%;width:170px;height:420px;top:30px}}
@media(min-width:900px){.anat{left:36%}.anat::before{content:"";position:absolute;inset:0 auto 0 0;width:28%;z-index:1;background:linear-gradient(90deg,#0E0F11,transparent)}}
@media(max-width:899px){.hero .top{position:absolute;left:0;right:0;top:0}.anat{position:relative;height:64svh;z-index:0;flex:none}.anat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:35%;background:linear-gradient(transparent,#0E0F11)}.hero__in{padding-top:0;margin-top:-34px;position:relative;z-index:1}}
/* adım adım kesim */
.cut{position:relative;background:#0B0C0D;color:#ECEDEF}
.cut__v{position:relative;height:min(86svh,820px);border-radius:6px;overflow:hidden;margin-top:28px}
.cut .reel__narr{font-size:clamp(30px,5.4vw,64px);max-width:14ch}
.cut .reel__narr small{color:#C6CAD0}
.hero .reel__dots{top:80px;bottom:auto;right:16px;left:auto}.hero .reel__bars{top:86px}.hero .reel__narr small{color:#C6CAD0}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,9,10,.7) 0%,rgba(8,9,10,.25) 35%,rgba(8,9,10,.6) 65%,rgba(8,9,10,.95) 100%)}
.top{padding:12px 0;position:relative;z-index:3}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand{margin-right:auto;text-decoration:none;display:flex;flex-direction:column;justify-content:center;min-height:44px;line-height:1;color:inherit}
.brand b{font:400 26px/1 var(--k-display);letter-spacing:.14em}
.brand small{font-size:10px;letter-spacing:.16em;opacity:.75;margin-top:4px;white-space:nowrap}
.hero .k-langs{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}
.hero .k-langs button{color:#ECEDEF}.hero .k-langs button[aria-pressed=true]{background:#ECEDEF;color:#0E0F11}
.hero .k-theme{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#ECEDEF}
.nav{display:none}
@media(min-width:1000px){.nav{display:flex;gap:2px;margin-right:10px}.nav a{color:#ECEDEF;text-decoration:none;font-size:15px;padding:11px 12px;border-radius:4px;opacity:.85}.nav a:hover{opacity:1;background:rgba(255,255,255,.08)}}
.hero__in{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 38px}
.hero__kicker{display:inline-flex;align-items:center;gap:10px;font-size:14px;opacity:.85;margin-bottom:16px}
.hero__kicker i{width:28px;height:1px;background:var(--silver)}
.hero h1{font-size:clamp(46px,12.5vw,140px);line-height:.95;max-width:11ch;text-wrap:balance}
.hero p{max-width:40ch;font-size:17px;color:#C6CAD0;margin:18px 0 24px}
.hero p.anat__narr{font-family:var(--k-display);font-size:clamp(24px,3.2vw,36px);line-height:1.1;color:#ECEDEF;max-width:20ch;min-height:2.5em;margin:16px 0 22px}
.anat__narr span{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(6px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s}
.anat__narr.in span{opacity:1;transform:none;filter:none}
.anat__narr small{display:block;font-family:var(--k-font);font-size:16px;color:#C6CAD0;margin-top:.5em;line-height:1.35}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px}
.hero__tools{display:flex;gap:18px;margin-top:30px;font-size:13px;color:#9AA0A8;flex-wrap:wrap}
.hero__tools span{display:flex;align-items:center;gap:8px}
.hero__tools span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--silver)}
@media(min-width:900px){.hero__in{padding-bottom:110px}.hero h1{font-size:clamp(56px,6.6vw,104px)}}
/* ===== aletler ===== */
section{padding:80px 0}
.h2{font-size:clamp(36px,7.5vw,80px);line-height:1;max-width:16ch;text-wrap:balance}
.lede{color:var(--k-muted);font-size:17px;max-width:52ch;margin:16px 0 0}
.tools{display:grid;gap:12px;margin-top:34px}
.tool{position:relative;overflow:hidden;border-radius:6px;min-height:340px;background:#000;isolation:isolate;display:flex;align-items:flex-end;color:#ECEDEF}
.tool img,.tool video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.4s var(--ease)}
.tool:hover img{transform:scale(1.06)}
.tool::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.85))}
.tool div{padding:20px}
.tool h3{font-size:34px}
.tool p{margin:4px 0 0;color:#C6CAD0;font-size:15px;max-width:30ch}
.tool .k-photo-tag{top:12px;bottom:auto}
@media(min-width:860px){.tools{grid-template-columns:1.4fr 1fr 1fr;grid-auto-rows:280px}.tool:first-child{grid-row:span 2;min-height:0}.tool{min-height:0}.tool--wide{grid-column:span 2}}
/* ===== yüz analizi ===== */
.face{background:var(--k-surface);border-block:1px solid var(--k-line)}
.face__grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;margin-top:34px}
.face__grid>*{min-width:0}
.scan{position:relative;aspect-ratio:3/4;max-height:620px;border-radius:6px;overflow:hidden;background:#0B0C0E;border:1px solid var(--k-line);display:grid;place-items:center}
.scan img,.scan canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan__empty{position:relative;text-align:center;color:#9AA0A8;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.scan__empty svg{width:120px;height:150px;opacity:.9}
.scan__bar{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#E6E8EB,transparent);box-shadow:0 0 18px #E6E8EB;top:0;display:none}
.scan.is-scanning .scan__bar{display:block;animation:scan 1.6s var(--ease) infinite}
@keyframes scan{0%{top:6%}50%{top:92%}100%{top:6%}}
.scan__status{position:absolute;left:12px;bottom:12px;right:12px;font-size:13px;color:#ECEDEF;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:4px;display:none}
.scan.has-status .scan__status{display:block}
.panel{display:flex;flex-direction:column;gap:16px}
.panel__privacy{font-size:14px;color:var(--k-muted);border-left:2px solid var(--k-line);padding-left:12px;margin:0}
.panel__row{display:flex;flex-wrap:wrap;gap:10px}
.lab{font-size:13px;font-weight:700;color:var(--k-muted);margin:6px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:46px;padding:0 14px;border-radius:4px;border:1px solid var(--k-line);background:transparent;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chips button[aria-pressed=true]{background:var(--k-fg);color:var(--k-bg);border-color:var(--k-fg)}
.chips svg{width:18px;height:22px}
.result{display:none;border:1px solid var(--k-line);border-radius:6px;padding:18px}
.result.on{display:block;animation:rise .7s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.result h3{font-size:30px}
.result p{color:var(--k-muted);margin:6px 0 14px}
.picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start}
.pick{position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;color:inherit}
.pick img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;display:block;filter:grayscale(.2)}
.pick span{display:block;font-size:13px;font-weight:600;margin-top:6px;line-height:1.25}
.pick[aria-pressed=true] img{outline:2px solid var(--k-fg);outline-offset:2px}
@media(min-width:960px){.face__grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:start}}
/* ===== katalog ===== */
.cat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:34px}
.style{position:relative;border:0;padding:0;background:#000;cursor:pointer;color:#ECEDEF;text-align:left;border-radius:6px;overflow:hidden;aspect-ratio:3/4}
.style img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),filter .6s;filter:grayscale(.35)}
.style:hover img{transform:scale(1.05);filter:none}
.style::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.85))}
.style span{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;font:400 20px/1.1 var(--k-display)}
.style small{display:block;font:500 12px var(--k-font);color:#C6CAD0;margin-top:4px}
.style[aria-pressed=true]{outline:2px solid var(--k-fg);outline-offset:3px}
.style[aria-pressed=true]::before{content:"✓";position:absolute;right:10px;top:10px;z-index:2;width:28px;height:28px;border-radius:50%;background:#ECEDEF;color:#0E0F11;display:grid;place-items:center;font-weight:700}
@media(min-width:760px){.cat{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1100px){.cat{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cat-note{font-size:13px;color:var(--k-muted);margin-top:10px}
/* ===== ustanın elinden ===== */
.reel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:30px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.reel figure{flex:none;width:min(70vw,300px);aspect-ratio:9/14;margin:0;position:relative;border-radius:6px;overflow:hidden;background:#000;scroll-snap-align:start}
.reel video{width:100%;height:100%;object-fit:cover}
.reel figcaption{position:absolute;left:12px;bottom:12px;right:12px;color:#ECEDEF;font-size:14px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.8)}
@media(min-width:1100px){.reel{margin:30px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}.reel figure{width:auto}}
/* ===== sıra ===== */
.book{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;margin-top:30px}
.book>*{min-width:0}
.book__card{border:1px solid var(--k-line);border-radius:6px;padding:20px 18px;background:var(--k-surface)}
.book__sel{font:400 26px/1.15 var(--k-display);margin:0 0 4px}
.bdays{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.bdays button{flex:none;width:68px;min-height:78px;border-radius:4px;border:1px solid var(--k-line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.1}
.bdays b{font:400 24px var(--k-display)}
.bdays small{font-size:12px;color:var(--k-muted);text-transform:capitalize}
.bdays button[aria-pressed=true]{background:var(--k-fg);color:var(--k-bg)}
.bdays button[aria-pressed=true] small{color:inherit}
.book textarea{width:100%;min-height:70px;border-radius:4px;border:1px solid var(--k-line);background:var(--k-bg);padding:10px 12px;font-size:16px}
.book .btn-silver{width:100%;margin-top:18px}
.ticker{padding:20px 0;border-block:1px solid var(--k-line);font:400 clamp(24px,4.5vw,36px)/1.15 var(--k-display);--k-mq-speed:30s}
.ticker small{font:500 12px var(--k-font);color:var(--k-muted)}
.ticker b{font-weight:400}
/* ===== bul ===== */
.find__grid{display:grid;gap:16px;margin-top:28px}
.find__map{border-radius:6px;overflow:hidden;border:1px solid var(--k-line);min-height:320px}
.find__info{display:flex;flex-direction:column;gap:10px;justify-content:center}
.find__addr{font:400 28px/1.15 var(--k-display)}
.k-btn--line{background:transparent;border:1px solid var(--k-line);color:var(--k-fg)}
.rate{font-size:14px;color:var(--k-muted);display:inline-flex;gap:8px;align-items:center;min-height:44px}
.ya{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fc3f1d;color:#fff;font:800 14px/1 Arial,sans-serif;flex:none}
@media(min-width:900px){.find__grid{grid-template-columns:1.4fr 1fr}.find__map{min-height:420px}}
footer{padding:36px 0 30px;border-top:1px solid var(--k-line)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer strong{font:400 24px var(--k-display);letter-spacing:.12em}
@media(min-width:900px){footer{padding-bottom:110px}}
</style>
</head>
<body>
<div class="hero" id="top">
  <div class="anat" id="anat" aria-hidden="true"><video id="anatv" muted playsinline crossorigin="anonymous" preload="auto"></video><svg id="anatsvg"></svg><i class="anat__vig"></i></div>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="#top"><b>TIGA</b><small data-t="brand_sub"></small></a>
      <nav class="nav" aria-label="menu"><a href="#face" data-t="nav_face"></a><a href="#styles" data-t="nav_styles"></a><a href="#book" data-t="nav_book"></a><a href="#find" data-t="nav_find"></a></nav>
      <div class="k-langs" role="group" data-ta="aria-label:k_lang"><button type="button" data-setlang="ru">RU</button><button type="button" data-setlang="tr">TR</button><button type="button" data-setlang="en">EN</button></div>
      <button type="button" class="k-theme" data-theme-toggle data-ta="aria-label:k_theme"><svg class="k-i-moon"><use href="#k-moon"/></svg><svg class="k-i-sun"><use href="#k-sun"/></svg></button>
    </div>
  </header>
  <main class="hero__in">
    <div class="wrap">
      <span class="hero__kicker"><i></i><span data-t="kicker"></span></span>
      <h1 data-t="hero_h1"></h1>
      <p id="hnarr" class="anat__narr" aria-live="polite"></p>
      <div class="hero__cta">
        <a class="btn-silver" href="#face"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><circle cx="12" cy="11" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 18c1-2.4 3-3.5 5-3.5s4 1.1 5 3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="cta_face"></span></a>
        <a class="btn-line" href="#book" data-t="cta_book"></a>
      </div>
      <div class="hero__tools"><span data-t="t_clip"></span><span data-t="t_sci"></span><span data-t="t_raz"></span><span data-t="t_comb"></span></div>
    </div>
  </main>
  <span class="k-photo-tag" data-t="tag_v"></span>
</div>

<section class="cut" aria-labelledby="h-cut">
  <div class="wrap">
    <h2 class="h2" id="h-cut" data-t="cut_h"></h2>
    <div class="cut__v" data-reel="px:4718401/4718401-hd_1280_720_25fps,px:7686550/7686550-hd_1280_720_24fps,43241,40129,43232" data-every="6200" data-fx="fade" data-slow="0.6" data-grade="cine" data-bars data-steps data-narr="c1,c2,c3,c4,c5"><span class="k-photo-tag" data-t="tag_v"></span></div>
  </div>
</section>

<section id="tools" aria-labelledby="h-tools" style="position:relative">
  <div class="pole3d" data-3d="pole" data-colors="#B3261E,#1F4FA3"></div>
  <div class="wrap">
    <h2 class="h2" id="h-tools" data-t="tools_h"></h2>
    <p class="lede" data-t="tools_p"></p>
    <div class="tools">
      <article class="tool"><img loading="lazy" width="1000" height="1200" src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=1000&h=1200&q=72" alt="" data-ta="alt:a_tools"><span class="k-photo-tag" data-t="tag"></span><div><h3 data-t="t_clip"></h3><p data-t="t_clip_d"></p></div></article>
      <article class="tool"><div data-slow="0.7" data-grade="cine" data-reel="43241,43233" data-every="3500" style="position:absolute;inset:0;z-index:-2"></div><span class="k-photo-tag" data-t="tag_v"></span><div><h3 data-t="t_sci"></h3><p data-t="t_sci_d"></p></div></article>
      <article class="tool"><div data-slow="0.7" data-grade="cine" data-reel="40129,40122" data-every="3500" style="position:absolute;inset:0;z-index:-2"></div><span class="k-photo-tag" data-t="tag_v"></span><div><h3 data-t="t_raz"></h3><p data-t="t_raz_d"></p></div></article>
      <article class="tool tool--wide"><div data-slow="0.7" data-grade="cine" data-reel="43232,43235" data-every="3500" style="position:absolute;inset:0;z-index:-2"></div><span class="k-photo-tag" data-t="tag_v"></span><div><h3 data-t="t_comb"></h3><p data-t="t_comb_d"></p></div></article>
    </div>
  </div>
</section>

<section class="face" id="face" aria-labelledby="h-face">
  <div class="wrap">
    <h2 class="h2" id="h-face" data-t="face_h"></h2>
    <p class="lede" data-t="face_p"></p>
    <div class="face__grid">

  onReady: function (K) {
    var $ = K.$, $$ = K.$$, S = SITE, U = function (id, w, h) { return 'https://images.unsplash.com/' + id + '?auto=format&fit=crop&w=' + w + '&h=' + h + '&q=65'; };
    var st = { style: null, shape: null, hair: null, who: 'o_me', extra: [], day: null, time: 'o_evening' };
    /* video: azaltılmış harekette durdur; aşağıdaki videolar görününce yüklensin */
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { var v = e.target; if (e.isIntersecting) { var s = v.querySelector('source'); if (s.dataset.src && !s.src) { s.src = s.dataset.src; v.load(); } if (!K.reduced) v.play().catch(function () {}); } else v.pause(); }); }, { rootMargin: '200px' });
    $$('[data-lazyv]').forEach(function (v) { io.observe(v); });
    /* yüz şekli ikonları */
    var SH = { oval: 'M12 2C7 2 4 6 4 11.5S7 22 12 22s8-5 8-10.5S17 2 12 2Z', round: 'M12 3a8.5 8.5 0 1 0 0 17 8.5 8.5 0 0 0 0-17Z', square: 'M5 3h14v12c0 4-3 7-7 7s-7-3-7-7Z', long: 'M12 1C8 1 6 4 6 9v6c0 5 2.5 8 6 8s6-3 6-8V9c0-5-2-8-6-8Z', heart: 'M3 4h18c0 9-4 17-9 18C7 21 3 13 3 4Z' };
    function renderShapes() { $('#shapes').innerHTML = Object.keys(SH).map(function (k) { return '<button type="button" data-v="' + k + '"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + SH[k] + '" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>' + K.esc(K.t('shape_' + k)) + '</button>'; }).join(''); }
    function renderCat() { $('#cat').innerHTML = S.styles.map(function (s) { return '<button type="button" class="style" data-style="' + s[0] + '"><img loading="lazy" width="360" height="480" src="' + U(s[1], 360, 480) + '" alt=""><span>' + K.esc(K.t(s[0])) + '<small>' + K.esc(K.t(s[0] + '_d')) + '</small></span></button>'; }).join(''); }
    function picksFor(shape) {
      var list = S.advice[shape].slice(), h = st.hair && S.hairAdvice[st.hair];
      if (h && list.indexOf(h) < 0) list[2] = h;
      return list;
    }
    function showResult() {
      if (!st.shape) return;
      $('#r-title').textContent = K.t('r_title', { s: K.t('shape_' + st.shape) });
      $('#r-text').textContent = K.t('d_' + st.shape);
      $('#picks').innerHTML = picksFor(st.shape).map(function (k) { var s = S.styles.find(function (x) { return x[0] === k; }); return '<button type="button" class="pick" data-style="' + k + '"><img src="' + U(s[1], 240, 300) + '" alt="" width="240" height="300"><span>' + K.esc(K.t(k)) + '</span></button>'; }).join('');
      $('#result').classList.add('on'); paint();
    }
    function days() { var ds = K.dayList(10); if (!st.day) st.day = ds[0].iso; $('#bdays').innerHTML = ds.map(function (d) { return '<button type="button" data-day="' + d.iso + '"><small>' + K.esc(d.wd) + '</small><b>' + d.d + '</b><small>' + K.esc(d.mo) + '</small></button>'; }).join(''); }
    function paint() {
      $$('[data-g]').forEach(function (g) { $$('button', g).forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.v === st[g.dataset.g] ? 'true' : 'false'); }); });
      $$('[data-m] button').forEach(function (b) { b.setAttribute('aria-pressed', st.extra.indexOf(b.dataset.v) > -1 ? 'true' : 'false'); });
      $$('[data-style]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.style === st.style ? 'true' : 'false'); });
      $$('#bdays button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.day === st.day ? 'true' : 'false'); });
      $('#b-sel').textContent = st.style ? K.t(st.style) : K.t('b_none');
    }
    document.addEventListener('click', function (e) {
      var s = e.target.closest('[data-style]'); if (s) { st.style = st.style === s.dataset.style ? null : s.dataset.style; paint(); return; }
      var g = e.target.closest('[data-g] button'); if (g) { st[g.parentNode.dataset.g] = g.dataset.v; if (g.parentNode.dataset.g === 'shape' || g.parentNode.dataset.g === 'hair') showResult(); paint(); return; }
      var m = e.target.closest('[data-m] button'); if (m) { var i = st.extra.indexOf(m.dataset.v); if (i > -1) st.extra.splice(i, 1); else st.extra.push(m.dataset.v); paint(); return; }
      var d = e.target.closest('#bdays [data-day]'); if (d) { st.day = d.dataset.day; paint(); }
    });
    $('#manual-btn').addEventListener('click', function () { $('#manual').hidden = false; });
    /* ---- yüz analizi: MediaPipe Face Landmarker, tarayıcıda çalışır ---- */
    var scan = $('#scan'), status = $('#scan-status'), landmarker = null;
    function say(k) { status.textContent = K.t(k); scan.classList.add('has-status'); }
    async function getLandmarker() {
      if (landmarker) return landmarker;
      var V = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
      var fs = await V.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      landmarker = await V.FaceLandmarker.createFromOptions(fs, { baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' }, runningMode: 'IMAGE', numFaces: 1 });
      return landmarker;
    }
    function classify(p) {
      var d = function (a, b) { return Math.hypot(p[a].x - p[b].x, p[a].y - p[b].y); };
      var H = d(10, 152), cheek = d(234, 454), jaw = d(172, 397), fore = d(54, 284);
      var r = H / cheek, j = jaw / cheek, f = fore / cheek;
      /* r: alın ortasından çeneye / elmacık genişliği (landmark 10 saç çizgisi değil) */ var shape = r > 1.02 ? 'long' : r < 0.86 ? 'round' : (j > 0.86 && r < 0.95) ? 'square' : (f - j > 0.12) ? 'heart' : 'oval';
      return { shape: shape, r: r, j: j, f: f };
    }
    function draw(img, p) {
      var cv = $('#scan-cv'), W = scan.clientWidth, Hh = scan.clientHeight, dpr = devicePixelRatio || 1;
      cv.width = W * dpr; cv.height = Hh * dpr; cv.hidden = false; var c = cv.getContext('2d'); c.scale(dpr, dpr);
      var s = Math.max(W / img.naturalWidth, Hh / img.naturalHeight), ox = (W - img.naturalWidth * s) / 2, oy = (Hh - img.naturalHeight * s) / 2;
      var P = function (i) { return [ox + p[i].x * img.naturalWidth * s, oy + p[i].y * img.naturalHeight * s]; };
      var oval = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109, 10];
      c.strokeStyle = 'rgba(230,232,235,.9)'; c.lineWidth = 1.5; c.beginPath(); oval.forEach(function (i, k) { var q = P(i); k ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.stroke();
      c.setLineDash([5, 5]); c.strokeStyle = 'rgba(185,190,197,.95)';
      [[10, 152], [234, 454], [172, 397], [54, 284]].forEach(function (l) { var a = P(l[0]), b = P(l[1]); c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); });
      c.setLineDash([]); c.fillStyle = '#ECEDEF';
      p.forEach(function (_, i) { if (i % 9) return; var q = P(i); c.fillRect(q[0] - 1, q[1] - 1, 2, 2); });
    }
    $('#file').addEventListener('change', function () {
      var f = this.files && this.files[0]; if (!f) return;
      var img = $('#scan-img'), url = URL.createObjectURL(f);
      img.onload = async function () {
        $('#scan-empty').hidden = true; img.hidden = false; $('#scan-cv').hidden = true; scan.classList.add('is-scanning'); say('st_load');
        try {
          var lm = await getLandmarker(); say('st_scan');
          var res = lm.detect(img);
          await new Promise(function (r) { setTimeout(r, K.reduced ? 0 : 1200); });
          scan.classList.remove('is-scanning');
          if (!res.faceLandmarks || !res.faceLandmarks.length) { say('st_none'); $('#manual').hidden = false; return; }
          var p = res.faceLandmarks[0], c = classify(p); window.__face = c; draw(img, p);
          st.shape = c.shape; scan.classList.remove('has-status'); renderShapes(); $('#manual').hidden = false; showResult();
        } catch (err) { console.warn(err); scan.classList.remove('is-scanning'); say('st_err'); $('#manual').hidden = false; }
      };
      img.src = url;
    });
    /* gönder */
    $('#bookform').addEventListener('submit', function (e) {
      e.preventDefault(); var note = $('#bnote').value.trim();
      var parts = [st.style ? K.t(st.style) : K.t('b_none'), K.t(st.who)].concat(st.extra.map(function (x) { return K.t(x); })).concat([K.fmtDay(st.day), K.t(st.time)]);
      var c = K.t('k_hello') + ' ' + K.t('m_line', { list: parts.join(' · ') }) + (st.shape ? '\n' + K.t('m_face', { v: K.t('shape_' + st.shape) }) : '') + (note ? '\n' + note : '');
      var tr = ['🔔 TALEP: ' + K.t('m_title', null, 'tr'), '✂️ Kesim: ' + (st.style ? K.t(st.style, null, 'tr') : 'seçilmedi'), '👤 Kimin için: ' + K.t(st.who, null, 'tr')];
      if (st.extra.length) tr.push('➕ Ek: ' + st.extra.map(function (x) { return K.t(x, null, 'tr'); }).join(', '));
      if (st.shape) tr.push('🙂 Yüz şekli (tahmin): ' + K.t('shape_' + st.shape, null, 'tr') + (st.hair ? ' · saç: ' + K.t(st.hair, null, 'tr') : ''));
      tr.push('📅 ' + K.fmtDay(st.day, 'tr') + ' · ' + K.t(st.time, null, 'tr'));
      if (note) tr.push('✍️ Not: ' + note);
      K.handoff(c, tr);
    });
    function all() { renderShapes(); renderCat(); days(); if (st.shape) showResult(); paint(); }
    document.addEventListener('kit:lang', all); all();
  }
};

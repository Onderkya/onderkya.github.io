<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0B">
<title>Hascar Rent A Car · Lara, Antalya</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Manrope:wght@400;600;700;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://videos.pexels.com"><link rel="preconnect" href="https://images.pexels.com">
<link rel="stylesheet" href="../_kit/kit.css">
<style>
:root{--k-bg:#FBF3E8;--k-fg:#132A36;--k-muted:#5E6B70;--k-surface:#FFFDF9;--k-line:#EADBC6;--k-acc:#1D4F91;--k-acc-fg:#FFFFFF;--flap:#16191E;--flapfg:#FFCC33;--paper:#FFFDF8;--k-font:'Manrope',system-ui,sans-serif;--k-display:'Unbounded','Manrope',sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;--k-dock-bg:rgba(255,255,255,.9);--ease:cubic-bezier(.16,1,.3,1)}
[data-theme=dark]{--k-bg:#0A0A0B;--k-fg:#EEEAE3;--k-muted:#A39D93;--k-surface:#141416;--k-line:#27272B;--k-acc:#E3B04B;--k-acc-fg:#120E06;--paper:#F4F1E8;--k-dock-bg:rgba(10,10,11,.9)}
::selection{background:var(--flapfg);color:#16191E}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--k-display);margin:0;letter-spacing:-.02em}
.top{padding:12px 0}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand{margin-right:auto;text-decoration:none;display:flex;align-items:center;gap:10px;min-height:44px}
.brand i{width:34px;height:34px;border-radius:9px;background:var(--k-acc);color:var(--k-acc-fg);display:grid;place-items:center;font:800 15px var(--k-display);font-style:normal}
.brand b{font:800 18px/1 var(--k-display)}
.brand small{display:block;font-size:12px;color:var(--k-muted);font-weight:700;margin-top:3px;white-space:nowrap}
.nav{display:none}
@media(min-width:980px){.nav{display:flex;gap:2px;margin-right:10px}.nav a{text-decoration:none;font-weight:700;font-size:15px;padding:11px 12px;border-radius:10px}.nav a:hover{background:var(--k-surface)}}

/* ===== vitrin: dikey araç sütunları (hep koyu) ===== */
.top{background:#0A0A0B;color:#EEEAE3}
.top .k-langs{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}.top .k-langs button{color:#EEEAE3}.top .k-langs button[aria-pressed=true]{background:#EEEAE3;color:#0A0A0B}
.top .k-theme{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16);color:#EEEAE3}.top .nav a{color:#EEEAE3}.top .nav a:hover{background:rgba(255,255,255,.08)}.top .brand small{color:#A39D93}
.show{position:relative;background:#0A0A0B;color:#EEEAE3;padding:18px 0 34px;overflow:hidden}
.show::before{content:"";position:absolute;left:50%;top:-30%;width:120%;height:70%;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(227,176,75,.10),transparent 70%);pointer-events:none}
.show h1{font-size:clamp(30px,7.4vw,58px);line-height:.98;font-weight:800;max-width:15ch;text-wrap:balance}
.show__sub{margin:12px 0 0;color:#A39D93;font-size:17px;max-width:46ch}
.cols{display:flex;gap:8px;margin-top:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;scrollbar-width:none}
.cols::-webkit-scrollbar{display:none}
.col{position:relative;flex:none;width:58vw;max-width:300px;height:min(64svh,620px);min-height:420px;border:0;padding:0;border-radius:14px;overflow:hidden;background:#000;color:#fff;text-align:left;cursor:pointer;scroll-snap-align:center;box-shadow:0 40px 60px -30px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.06);transition:flex-grow .9s var(--ease),transform .6s var(--ease)}
.col .col__v{position:absolute;inset:0}
.col::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 55%,rgba(0,0,0,.88));pointer-events:none}
.col__t{position:absolute;z-index:4;left:16px;right:16px;bottom:16px;display:flex;flex-direction:column;gap:4px}
.col__t b{font:800 clamp(19px,1.9vw,27px)/1.05 var(--k-display);letter-spacing:-.02em;overflow-wrap:break-word}
.col__t small{font-size:14px;color:#D6D1C8}
.col__t i{font-style:normal;align-self:flex-start;margin-top:8px;font-size:13px;font-weight:700;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.col--suv video{object-position:22% 50%}.col--mid video{object-position:38% 50%}.col--lux video{scale:1.55;transform-origin:50% 88%}.col--lux .reel__p{object-position:50% 90%}
.col:focus-visible{outline:3px solid var(--k-acc);outline-offset:3px}
.perks{list-style:none;display:flex;flex-wrap:wrap;gap:8px 22px;margin:22px 0 0;padding:0;color:#EEEAE3;font-weight:700}
.perks li{display:flex;align-items:center;gap:10px;min-height:32px}
.perks li::before{content:"";width:8px;height:8px;border-radius:50%;background:#E3B04B;box-shadow:0 0 12px rgba(227,176,75,.8)}
.show .k-photo-tag{top:auto;bottom:10px;right:16px}
@media(min-width:900px){.show .wrap:first-child{display:flex;align-items:flex-end;justify-content:space-between;gap:30px}.show__sub{max-width:34ch;text-align:right}.cols{overflow:visible;padding:0;margin-inline:auto;width:min(1180px,100% - 32px)}.col{flex:1 1 0;width:auto;max-width:none;height:max(440px,calc(100svh - 300px))}.col:hover,.col:focus-visible{flex-grow:1.7}}
/* ===== 3 adım: WhatsApp / Telegram ===== */
.flow3{list-style:none;margin:34px 0 0;padding:0;display:grid;gap:10px}
.flow3 li{display:grid;grid-template-columns:44px 1fr;gap:2px 14px;padding:16px;border-radius:18px;background:var(--k-surface);border:1px solid var(--k-line)}
.flow3 li>span{grid-row:span 2;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--k-display);background:var(--k-acc);color:var(--k-acc-fg)}
.flow3 b{font-size:17px}.flow3 p{margin:0;color:var(--k-muted);font-size:15px}
@media(min-width:900px){.flow3{grid-template-columns:repeat(3,1fr)}}
/* ===== tabela ===== */
.hero{padding:40px 0 40px;position:relative;isolation:isolate}
.hero__bg{position:absolute;left:0;right:0;top:-80px;height:min(78svh,720px);z-index:-1;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hero__bg img{width:100%;height:100%;object-fit:cover;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.1) translate(-2%,1%)}}
.hero__bg::after{z-index:1;content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,243,232,.05) 0%,rgba(251,243,232,.25) 50%,var(--k-bg) 100%)}
[data-theme=dark] .hero__bg::after{z-index:1;background:linear-gradient(180deg,rgba(12,26,36,.25) 0%,rgba(12,26,36,.5) 45%,var(--k-bg) 100%)}
.hero__bg .k-photo-tag{top:90px;bottom:auto;z-index:2}
.top{position:relative;z-index:2}
.board{background:var(--flap);border-radius:22px;padding:16px 14px 18px;box-shadow:0 30px 60px -30px rgba(10,20,30,.6),inset 0 1px 0 rgba(255,255,255,.06);color:#d8dde3}
.board__head{display:flex;justify-content:space-between;align-items:center;font:700 11px/1 var(--mono);letter-spacing:.08em;color:#8a95a1;margin:0 2px 12px}
.board__head span:last-child{display:flex;align-items:center;gap:6px}
.board__head span:last-child::before{content:"";width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;animation:blink 1.6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.row{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.row__lab{font:700 11px/1 var(--mono);letter-spacing:.08em;color:#8a95a1;margin:0 2px 6px}
.cell{position:relative;aspect-ratio:.72;border-radius:4px;background:linear-gradient(#262b33 0 49.5%,#1d2128 50.5% 100%);display:grid;place-items:center;font:800 clamp(17px,5.4vw,40px)/1 var(--mono);color:var(--flapfg);overflow:hidden;box-shadow:inset 0 -1px 0 rgba(0,0,0,.6)}
.cell::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.65)}
.cell.flip{animation:flip .09s linear}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(70deg);filter:brightness(.6)}100%{transform:rotateX(0)}}
.row--b .cell{color:#fff}
.hero h1{font-size:clamp(38px,10.5vw,104px);line-height:.95;font-weight:800;margin:28px 0 14px;text-wrap:balance;max-width:14ch}
.hero__p{font-size:18px;color:var(--k-muted);max-width:40ch;margin:0}
.hero .reel__narr--flow{color:var(--k-fg);text-shadow:none;margin:0}.hero .reel__narr--flow small{color:var(--k-muted)}
@media(min-width:1000px){.hero{padding-top:56px}.hero__grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:start}.hero h1{margin-top:28px;font-size:clamp(48px,5.4vw,80px)}.board{padding:22px 22px 26px}.cell{font-size:30px}}

/* ===== biniş kartı ===== */
.pass{position:relative;margin-top:26px;filter:drop-shadow(0 26px 40px rgba(15,34,48,.22));transition:transform .9s var(--ease)}
.pass__main,.pass__stub{background:var(--paper);color:#13222d}
.pass__main{border-radius:20px 20px 0 0;padding:18px 18px 22px;-webkit-mask:radial-gradient(circle 13px at 0 100%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 100%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 13px at 0 100%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 100%,#0000 98%,#000) right/51% 100% no-repeat}
.pass__stub{border-radius:0 0 20px 20px;padding:16px 18px 18px;border-top:2px dashed #c9c2b2;-webkit-mask:radial-gradient(circle 13px at 0 0,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 0,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 13px at 0 0,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 0,#0000 98%,#000) right/51% 100% no-repeat;transition:transform .9s var(--ease),opacity .9s}
.pass.is-torn .pass__stub{transform:translate(30px,40px) rotate(7deg);opacity:0}
.pass__top{display:flex;justify-content:space-between;align-items:center;font:700 12px/1 var(--mono);letter-spacing:.06em;color:#6b7680}
.pass__top b{color:#1D4F91;font-family:var(--k-display);letter-spacing:0;font-size:15px}
.pass__route{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin:16px 0 14px}
.pass__route small{display:block;font:700 11px/1 var(--mono);color:#6b7680;letter-spacing:.06em;margin-bottom:6px}
.pass__route strong{font:800 24px/1 var(--k-display);letter-spacing:-.02em}
.pass__route .to{text-align:right}
.pass__plane{width:38px;height:38px;color:#1D4F91}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid #d8d1c2;background:#fff;font-weight:700;font-size:14px;cursor:pointer;color:#13222d}
.seg button[aria-pressed=true]{background:#13222d;color:#fff;border-color:#13222d}
.fld{display:grid;gap:6px;margin-top:14px}
.fld>span{font:700 11px/1 var(--mono);letter-spacing:.06em;color:#6b7680}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input{min-height:48px;border-radius:12px;border:1.5px solid #d8d1c2;background:#fff;padding:0 12px;font-size:16px;color:#13222d;width:100%;min-width:0}
.pass__stub .k-btn{width:100%}
.pass__note{margin:10px 0 0;font-size:13px;color:#6b7680;text-align:center}
.barcode{height:34px;margin-bottom:12px;background:repeating-linear-gradient(90deg,#13222d 0 2px,transparent 2px 4px,#13222d 4px 5px,transparent 5px 9px,#13222d 9px 12px,transparent 12px 14px);opacity:.85;border-radius:2px}
@media(min-width:1000px){.pass{margin-top:0}}

/* ===== kapılar (araç tipleri) ===== */
section{padding:72px 0}
.h2{font-size:clamp(30px,6vw,60px);line-height:1;font-weight:800;max-width:16ch;text-wrap:balance}
.lede{color:var(--k-muted);font-size:17px;max-width:52ch;margin:14px 0 0}
.gates{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 18px;margin:28px -16px 0;scrollbar-width:none}
.gates::-webkit-scrollbar{display:none}
.gate{flex:none;width:min(78vw,360px);scroll-snap-align:start;border-radius:22px;overflow:hidden;background:var(--k-surface);border:1px solid var(--k-line)}
.gate__img{position:relative;aspect-ratio:4/3}
.gate__img img{width:100%;height:100%;object-fit:cover}
.gate__no{position:absolute;left:12px;top:12px;font:800 13px/1 var(--mono);background:var(--flap);color:var(--flapfg);padding:7px 9px;border-radius:6px;letter-spacing:.06em}
.gate__b{padding:16px 18px 18px}
.gate h3{font-size:22px}
.gate p{margin:6px 0 12px;color:var(--k-muted);font-size:15px}
.gate button{min-height:46px;padding:0 16px;border-radius:99px;border:1.5px solid var(--k-line);background:transparent;font-weight:700;cursor:pointer}
@media(min-width:1100px){.gates{margin:28px 0 0;padding:6px 0 18px;display:grid;grid-template-columns:repeat(4,1fr)}.gate{width:auto}}
.small-note{font-size:13px;color:var(--k-muted);margin-top:6px}

/* ===== bilgi panosu ===== */
.info{background:var(--flap);color:#e3e7ec}
.info__list{margin:30px 0 0;padding:0;list-style:none;border-top:1px solid #2a3038}
.info__list li{display:grid;grid-template-columns:64px 1fr;gap:4px 16px;padding:20px 0;border-bottom:1px solid #2a3038}
.info__list li>span{font:800 15px/1.2 var(--mono);color:var(--flapfg);letter-spacing:.06em;padding-top:4px;grid-row:span 2}
.info__list b{font-size:20px;font-family:var(--k-display);font-weight:600}
.info__list p{margin:4px 0 0;color:#9aa6b2}
.ticker{margin-top:44px;padding:18px 0;border-block:1px solid #2a3038;font-size:20px;--k-mq-speed:30s;color:#fff}
.ticker small{color:#9aa6b2}
.info .ya-link{display:inline-flex;align-items:center;gap:10px;margin-top:18px;min-height:44px;color:#c9d2da;font-size:14px}
@media(min-width:900px){.info__list{display:grid;grid-template-columns:repeat(3,1fr);gap:0 30px;border:0}.info__list li{border-top:1px solid #2a3038;border-bottom:0}}
.ya{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fc3f1d;color:#fff;font:800 14px/1 Arial,sans-serif;flex:none}

/* ===== bul ===== */
.find__grid{display:grid;gap:16px;margin-top:28px}
.find__map{border-radius:22px;overflow:hidden;border:1px solid var(--k-line);min-height:320px}
.find__info{display:flex;flex-direction:column;gap:10px;justify-content:center}
.find__addr{font:800 26px/1.15 var(--k-display);letter-spacing:-.02em}
.k-btn--line{background:var(--k-surface);border:1.5px solid var(--k-line);color:var(--k-fg)}
@media(min-width:900px){.find__grid{grid-template-columns:1.4fr 1fr}.find__map{min-height:420px}}
footer{padding:36px 0 30px;border-top:1px solid var(--k-line)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer strong{font:800 18px var(--k-display)}
@media(min-width:900px){footer{padding-bottom:110px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top"><i>H</i><span><b>Hascar</b><small data-t="brand_sub"></small></span></a>
    <nav class="nav" aria-label="menu"><a href="#book" data-t="nav_book"></a><a href="#show" data-t="nav_fleet"></a><a href="#info" data-t="nav_info"></a><a href="#find" data-t="nav_find"></a></nav>
    <div class="k-langs" role="group" data-ta="aria-label:k_lang"><button type="button" data-setlang="ru">RU</button><button type="button" data-setlang="tr">TR</button><button type="button" data-setlang="en">EN</button></div>
    <button type="button" class="k-theme" data-theme-toggle data-ta="aria-label:k_theme"><svg class="k-i-moon"><use href="#k-moon"/></svg><svg class="k-i-sun"><use href="#k-sun"/></svg></button>
  </div>
</header>
<main id="top">
  <section class="show" id="show" aria-labelledby="h1">
    <div class="wrap"><h1 id="h1" data-t="hero_h1"></h1><p class="show__sub" data-t="show_sub"></p></div>
    <div class="cols">
      <button type="button" class="col col--lux" data-pick="o_lux"><div class="col__v" data-reel="px:8345037/8345037-hd_720_1280_25fps" data-slow="0.7" data-grade="cine"></div><span class="col__t"><b data-t="o_lux"></b><small data-t="o_lux_s"></small><i data-t="pick"></i></span></button>
      <button type="button" class="col col--suv" data-pick="o_suv"><div class="col__v" data-slow="0.7" data-reel="px:8562464/8562464-hd_1280_720_60fps@0.5" data-grade="cine"></div><span class="col__t"><b data-t="o_suv"></b><small data-t="o_suv_s"></small><i data-t="pick"></i></span></button>
      <button type="button" class="col col--mid" data-pick="o_mid"><div class="col__v" data-reel="px:8865763/8865763-hd_1366_720_25fps" data-slow="0.7" data-grade="cine"></div><span class="col__t"><b data-t="o_mid"></b><small data-t="o_mid_s"></small><i data-t="pick"></i></span></button>
      <button type="button" class="col" data-pick="o_big"><div class="col__v" data-reel="px:6873503/6873503-hd_720_1280_25fps" data-slow="0.7" data-grade="cine"></div><span class="col__t"><b data-t="o_big"></b><small data-t="o_big_s"></small><i data-t="pick"></i></span></button>
    </div>
    <div class="wrap"><ul class="perks"><li data-t="pk1"></li><li data-t="pk2"></li><li data-t="pk3"></li><li data-t="pk4"></li></ul></div>
    <span class="k-photo-tag" data-t="tag_v"></span>
  </section>

  <section class="hero" aria-labelledby="pass-h">
    <div class="wrap hero__grid">
      <div>
        <div class="board" role="img" data-ta="aria-label:board_alt">
          <div class="board__head"><span data-t="board_h"></span><span>HASCAR · LARA</span></div>
          <div class="row__lab" data-t="board_r1"></div><div class="row" id="r1"></div>
          <div class="row__lab" data-t="board_r2" style="margin-top:12px"></div><div class="row row--b" id="r2"></div>
        </div>
      </div>
      <form class="pass" id="book" autocomplete="off" aria-labelledby="pass-h">
        <div class="pass__main">
          <div class="pass__top"><b>Hascar</b><span id="pass-h" data-t="pass_h"></span></div>
          <div class="pass__route">
            <div><small data-t="p_from"></small><strong>LARA</strong></div>
            <svg class="pass__plane" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 15c0-2 1-3 3-3.5L9 7c.6-.8 1.5-1 2.5-1h3c1.5 0 2.5.6 3.3 1.6L19.5 10c1.5.4 2.5 1.3 2.5 3v3H3Z"/><circle cx="7" cy="16.5" r="2" fill="currentColor"/><circle cx="17" cy="16.5" r="2" fill="currentColor"/></svg>
            <div class="to"><small data-t="p_to"></small><strong id="p-to-v"></strong></div>
          </div>
          <div class="fld"><span data-t="p_where"></span><div class="seg" data-seg="where"><button type="button" data-v="o_hotel" data-t="o_hotel"></button><button type="button" data-v="o_office" data-t="o_office"></button><button type="button" data-v="o_other" data-t="o_other"></button></div></div>
          <div class="fld2">
            <label class="fld"><span data-t="k_from"></span><input type="date" id="d1"></label>
            <label class="fld"><span data-t="k_to"></span><input type="date" id="d2"></label>
          </div>
          <div class="fld"><span data-t="p_cls"></span><div class="seg" data-seg="cls"><button type="button" data-v="o_lux" data-t="o_lux"></button><button type="button" data-v="o_eco" data-t="o_eco"></button><button type="button" data-v="o_mid" data-t="o_mid"></button><button type="button" data-v="o_suv" data-t="o_suv"></button><button type="button" data-v="o_big" data-t="o_big"></button></div></div>
          <div class="fld"><span data-t="p_gear"></span><div class="seg" data-seg="gear"><button type="button" data-v="o_auto" data-t="o_auto"></button><button type="button" data-v="o_manual" data-t="o_manual"></button></div></div>
          <label class="fld"><span data-t="p_hotel"></span><input type="text" id="hotel" maxlength="80" data-ta="placeholder:p_hotel_ph"></label>

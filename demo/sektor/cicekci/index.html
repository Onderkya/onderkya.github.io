<style>
:root{--k-bg:#FFF6F1;--k-fg:#24312A;--k-muted:#67736B;--k-surface:#FFFFFF;--k-line:#F0E1D9;--k-acc:#D8577A;--k-acc-fg:#FFFFFF;--tone:#F4A7B9;--k-font:'Commissioner',system-ui,sans-serif;--k-display:'Playfair Display',Georgia,serif;--k-dock-bg:rgba(255,246,241,.92);--k-btn-radius:99px;--ease:cubic-bezier(.16,1,.3,1)}
[data-theme=dark]{--k-bg:#22191B;--k-fg:#F7EDE8;--k-muted:#C6B2AE;--k-surface:#2E2225;--k-line:#45343A;--k-acc:#F08AA5;--k-acc-fg:#22191B;--k-dock-bg:rgba(34,25,27,.92)}
::selection{background:var(--tone);color:#24312A}
.wrap{width:min(1200px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--k-display);font-weight:500;margin:0;letter-spacing:-.01em}
.top{padding:12px 0;position:absolute;left:0;right:0;top:0;z-index:8;color:#fff}.top .brand{color:#fff}.top .k-langs{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}.top .k-langs button{color:#fff}.top .k-langs button[aria-pressed=true]{background:#fff;color:#111}.top .k-theme{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand{margin-right:auto;text-decoration:none;min-height:44px;display:flex;align-items:center;font:italic 500 24px/1 var(--k-display)}
/* giriş: papatya + ürün yaprakları */
.hero.dz{min-height:100svh;padding:0;background:#040404;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;isolation:isolate}
.dz .dz__v{position:absolute;left:0;top:0;width:100%;height:100%;z-index:-2;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent);mask-image:radial-gradient(closest-side,#000 72%,transparent)}

.dz::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 22%,transparent 62%,rgba(0,0,0,.9))}
.ring{position:absolute;inset:0;z-index:5;pointer-events:none}
.ring__glow{position:absolute;height:30px;margin-top:-15px;transform-origin:0 50%;border-radius:50%;background:linear-gradient(90deg,rgba(255,255,255,0) 15%,rgba(255,255,255,.16) 60%,rgba(255,255,255,0));opacity:0;transition:opacity .9s var(--ease),background .4s}
.ring.is-in .ring__glow{opacity:1}
.ring__glow.hot{background:linear-gradient(90deg,rgba(255,255,255,0) 10%,rgba(255,238,200,.5) 60%,rgba(255,255,255,0))}
.pet{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;text-align:center;max-width:96px;min-height:44px;min-width:44px;padding:8px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.32);background:rgba(10,10,10,.38);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font:600 13px/1.15 var(--k-font);cursor:pointer;opacity:0;transition:opacity .7s var(--ease),background .3s,color .3s,box-shadow .3s;will-change:transform}
.ring.is-in .pet{opacity:1}
.pet:hover,.pet:focus-visible{background:#fff;color:#141414;box-shadow:0 0 0 6px rgba(255,255,255,.12)}
.pet:focus-visible{outline:2px solid #fff;outline-offset:3px}
.dz .hero__in{position:relative;z-index:6;padding:0 0 30px}
.dz h1{font-size:clamp(40px,10vw,104px);line-height:.95;max-width:12ch;text-wrap:balance}@media(min-width:900px){.dz h1{font-size:clamp(56px,5.6vw,92px);max-width:8ch}.dz .hero__in{padding-bottom:30vh}}
.dz .hero__in p{color:#D9D4CC;margin:12px 0 0;font-size:16px}
.dz .k-photo-tag{z-index:6}
.petals{opacity:.75}
@media(min-width:900px){.dz .hero__in{padding-bottom:90px}.pet{max-width:150px;font-size:15px;padding:10px 16px}}
/* hero */
.hero{position:relative;padding-bottom:30px;overflow-x:clip}
.hero__reel{position:relative;height:62svh;min-height:360px;margin:0 12px;border-radius:32px;overflow:hidden}
.petals{position:absolute;inset:0;z-index:4;pointer-events:none}
.hero__in{position:relative;z-index:5}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.hero .reel__narr{max-width:12ch;font-size:clamp(40px,10.5vw,104px);line-height:.94}.hero .reel__bars{top:auto;bottom:16px}.hero .reel__narr small{font-size:max(15px,.2em)}
.hero h1.x{position:absolute;z-index:6;left:22px;right:22px;bottom:26px;font-size:clamp(44px,12vw,140px);line-height:.92;color:#FFF;text-shadow:0 2px 30px rgba(0,0,0,.4);max-width:10ch;pointer-events:none}
.hero__reel::after{content:"";position:absolute;inset:50% 0 0;z-index:2;background:linear-gradient(180deg,transparent,rgba(0,0,0,.45));pointer-events:none}
.hero__in p{margin:18px 0 0;color:var(--k-muted);font-size:15px}
@media(min-width:900px){.hero__reel{height:78svh;margin:0 20px}.hero h1{left:56px;bottom:48px;font-size:clamp(60px,7vw,108px);max-width:13ch}}
/* tonlar */
section{padding:72px 0}
.h2{font-size:clamp(38px,8vw,84px);line-height:.95;text-wrap:balance}
.tones{display:flex;gap:10px;overflow-x:auto;padding:18px 2px 10px;margin-top:10px;scrollbar-width:none}
.tones::-webkit-scrollbar{display:none}
.tone{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-weight:600;font-size:13px;color:var(--k-fg);min-width:64px}
.tone i{width:58px;height:58px;border-radius:50%;background:var(--c);box-shadow:inset 0 -6px 12px rgba(0,0,0,.12),0 0 0 3px var(--k-bg),0 0 0 4.5px var(--k-line);transition:transform .5s var(--ease)}
.tone[aria-pressed=true] i{transform:scale(1.12);box-shadow:inset 0 -6px 12px rgba(0,0,0,.12),0 0 0 3px var(--k-bg),0 0 0 6px var(--c)}
.tone-stage{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:16px}
.tone-stage>*{min-width:0}
.tone-reel{height:min(64svh,560px);border-radius:28px;overflow:hidden}
.tone-picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bq{position:relative;border:0;padding:0;border-radius:22px;overflow:hidden;background:#000;cursor:pointer;aspect-ratio:3/4;color:#fff;text-align:left}
.bq img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.bq:hover img{transform:scale(1.05)}
.bq::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.7))}
.bq span{position:absolute;z-index:1;left:12px;right:12px;bottom:12px;font:500 18px/1.15 var(--k-display)}
.bq small{display:block;font:600 11px var(--k-font);opacity:.85;margin-top:3px}
@media(min-width:900px){.tone-stage{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:stretch}.tone-reel{height:auto;min-height:560px}}
/* asistan */
.ai{background:linear-gradient(160deg,color-mix(in srgb,var(--tone) 30%,var(--k-bg)),var(--k-bg));border-block:1px solid var(--k-line)}
.chat__top{display:flex;align-items:center;gap:12px;padding:4px 4px 14px;border-bottom:1px solid var(--k-line);margin-bottom:12px}.chat__ava{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 50%,#F6C445 0 18%,#fff 19% 100%);box-shadow:0 0 0 3px var(--k-bg),0 0 0 4px var(--k-line);position:relative}.chat__ava::after{content:"";position:absolute;right:0;bottom:2px;width:11px;height:11px;border-radius:50%;background:#2DBE6C;box-shadow:0 0 0 2px var(--k-surface)}.chat__who b{display:block;font:500 20px/1.1 var(--k-display)}.chat__who small{color:var(--k-muted);font-size:13px}
.typing{display:inline-flex;gap:4px;padding:14px 16px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--k-muted);animation:tdot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes tdot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.msg__tip{display:block;margin-top:6px;color:var(--k-muted);font-size:14px}
.chat{max-width:780px;margin:26px auto 0;background:var(--k-surface);border:1px solid var(--k-line);border-radius:28px;padding:16px;box-shadow:0 30px 60px -40px rgba(36,49,42,.5)}
.chat__log{display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:520px;overflow-y:auto;padding:4px}
.msg{max-width:86%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.msg--bot{background:var(--k-bg);border:1px solid var(--k-line);border-bottom-left-radius:6px;align-self:flex-start}
.msg--me{background:var(--k-fg);color:var(--k-bg);border-bottom-right-radius:6px;align-self:flex-end}
.msg__cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;align-items:start}
.mini{border:0;padding:0;background:none;cursor:pointer;text-align:left;color:inherit}
.mini img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block}
.mini b{display:block;font-size:12px;margin-top:5px;line-height:1.25}
.mini small{font-size:11px;color:#2E8B57;font-weight:700}
.chat__sugs{display:flex;flex-wrap:wrap;gap:8px;padding:12px 2px}
.chat__sugs::-webkit-scrollbar{display:none}
.chat__sugs button{min-height:44px;padding:8px 14px;border-radius:18px 18px 18px 6px;border:1.5px solid var(--k-line);background:var(--k-bg);font-weight:600;font-size:14px;cursor:pointer;text-align:left;color:var(--k-fg)}.chat__sugs button:hover{border-color:var(--k-acc)}
.chat__in{display:flex;gap:8px}
.chat__in input{flex:1;min-width:0;min-height:52px;border-radius:99px;border:1.5px solid var(--k-line);background:var(--k-bg);padding:0 18px;font-size:16px}
.chat__in button{min-width:52px;min-height:52px;border-radius:50%;border:0;background:var(--k-acc);color:var(--k-acc-fg);cursor:pointer;font-size:20px}
.chat__note{font-size:12px;color:var(--k-muted);text-align:center;margin-top:10px}
/* florist */
.flor{display:grid;gap:22px;align-items:center}
.flor__v{height:min(78svh,640px);border-radius:28px;overflow:hidden}.flor__v .reel__narr{font-size:clamp(28px,4vw,46px)}
.flor q{display:block;font:italic 500 clamp(36px,7vw,66px)/1.05 var(--k-display);quotes:"«" "»"}
.flor small{color:var(--k-muted)}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.extras span{padding:10px 14px;border-radius:99px;background:var(--k-surface);border:1px solid var(--k-line);font-weight:600;font-size:14px}
@media(min-width:900px){.flor{grid-template-columns:1fr 1fr;gap:50px}}
.find{display:grid;gap:14px;margin-top:26px}
.find__map{border-radius:28px;overflow:hidden;min-height:300px;border:1px solid var(--k-line)}
.find__row{display:flex;flex-wrap:wrap;gap:10px}
.find__row .k-btn{flex:1 1 180px;background:var(--k-surface);border:1.5px solid var(--k-line);color:var(--k-fg)}
.find__row .k-btn--main{background:var(--k-acc);color:var(--k-acc-fg);border:0}
footer{padding:30px 0;border-top:1px solid var(--k-line)}
footer .wrap{display:flex;flex-direction:column;gap:4px}
@media(min-width:900px){footer{padding-bottom:110px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#top">Flower Farm</a>
  <div class="k-langs" role="group" data-ta="aria-label:k_lang"><button type="button" data-setlang="ru">RU</button><button type="button" data-setlang="tr">TR</button><button type="button" data-setlang="en">EN</button></div>
  <button type="button" class="k-theme" data-theme-toggle data-ta="aria-label:k_theme"><svg class="k-i-moon"><use href="#k-moon"/></svg><svg class="k-i-sun"><use href="#k-sun"/></svg></button>
</div></header>
<main id="top">

      <p data-t="d_p"></p>

    <span class="k-photo-tag" data-t="tag_v"></span>
  </section>

  <section id="tones" aria-labelledby="h-t" style="padding-top:30px">
    <div class="wrap">
      <h2 class="h2" id="h-t" data-t="t_h"></h2>

      <div class="tone-stage">

        <div class="tone-picks" id="tonepicks"></div>

    </div>
  </section>

  <section class="ai" id="ai" aria-labelledby="h-ai">
    <div class="wrap">
      <h2 class="h2" id="h-ai" data-t="ai_h" style="text-align:center;margin-inline:auto"></h2>
      <div class="chat">
        <div class="chat__top"><span class="chat__ava" aria-hidden="true"></span><span class="chat__who"><b data-t="ai_name"></b><small data-t="ai_role"></small></span></div>
        <div class="chat__log" id="log" aria-live="polite"></div>
        <div class="chat__sugs" id="sugs"></div>
        <form class="chat__in" id="ask"><input id="q" type="text" maxlength="160" autocomplete="off" data-ta="placeholder:ai_ph;aria-label:ai_ph"><button type="submit" aria-label="→">↑</button></form>
        <p class="chat__note" data-t="ai_note"></p>
      </div>
    </div>
  </section>

  <section aria-labelledby="h-fl">
    <div class="wrap flor">
      <div class="flor__v" data-slow="0.7" data-grade="cine" data-reel="15115,49067,15122" data-every="5600" data-fx="fade" data-bars data-steps data-narr="fs1,fs2,fs3"><span class="k-photo-tag" data-t="tag_v"></span></div>
      <div>
        <h2 class="k-sr" id="h-fl">Natalya</h2>
        <q lang="ru">Наталья — суперфлорист!</q>
        <small data-t="q_src"></small>
        <div class="extras"><span data-t="x1"></span><span data-t="x2"></span><span data-t="x3"></span><span data-t="x4"></span></div>
      </div>
    </div>
  </section>

  <section data-night></section>

  <section id="find" aria-labelledby="h-f" style="padding-top:0">
    <div class="wrap">
      <h2 class="h2" id="h-f" data-t="f_h"></h2>
      <div class="find">
        <div class="find__map"><iframe class="k-map" data-map loading="lazy"></iframe></div>
        <div class="find__row"><a class="k-btn" href="https://t.me/FlowerPlaceAntalya" target="_blank" rel="noopener">Telegram</a><a class="k-btn" href="https://www.instagram.com/flowerfarm_antalya" target="_blank" rel="noopener">Instagram</a><a class="k-btn k-btn--main" data-link="tel">+90 541 884 51 43</a></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><span class="k-demo" data-t="k_demo"></span><span class="k-demo" data-t="credits"></span></div></footer>

      }, K.reduced ? 0 : 900);
    }
    function sugs() { $('#sugs').innerHTML = ['s1', 's2', 's3', 's4', 's5'].map(function (k) { return '<button type="button" data-sug="' + k + '">' + K.esc(K.t(k)) + '</button>'; }).join(''); }
    function hello() { log.innerHTML = ''; say(K.esc(K.t('ai_hi'))); }
    $('#ask').addEventListener('submit', function (e) { e.preventDefault(); var v = $('#q').value.trim(); if (!v) return; $('#q').value = ''; answer(v); });
    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-tone]'); if (t) { setTone(t.dataset.tone); return; }
      var s = e.target.closest('[data-sug]'); if (s) { answer(K.t(s.dataset.sug)); return; }
      var p = e.target.closest('[data-pick]'); if (p) { K.openFlow('order', { bq: p.dataset.pick }); }
    });
    /* papatya: ürünler yaprakların üstünde, halka yavaşça döner; dokununca asistan o ürünü stoktan gösterir */
    var ring = $('#ring'), hero = $('.dz'), vbox = $('.dz__v'), VW = 1920, VH = 1080, FX = 0.47, FY = 0.45, FR = 0.2, off = -Math.PI / 2, paused = false, last = 0;
    function pets() {
      ring.innerHTML = S.petals.map(function (c, i) { return '<i class="ring__glow" data-g="' + i + '"></i><button type="button" class="pet" data-cat="' + c + '" style="transition-delay:' + (300 + i * 120) + 'ms">' + K.esc(K.t(c)) + '</button>'; }).join('');
      setTimeout(function () { ring.classList.add('is-in'); }, 60); place();
    }
    function place() {
      var cw = hero.clientWidth, ch = hero.clientHeight, wide = cw >= 900, sc = wide ? ch * 0.84 / (2 * FR * VW) : Math.min(Math.max(cw / VW, ch / VH), Math.min(cw * 0.96, ch * 0.8) / (2 * FR * VW)), W = VW * sc, H = VH * sc, ccx = wide ? cw * 0.67 : cw / 2, ccy = ch * (wide ? 0.5 : 0.42), dx = ccx - FX * W, dy = ccy - FY * H;
      vbox.style.width = W + 'px'; vbox.style.height = H + 'px'; vbox.style.left = dx + 'px'; vbox.style.top = dy + 'px';
      var cx = ccx, cy = ccy, R = FR * VW * sc, r = wide ? R * 0.7 : Math.min(Math.max(R * 0.72, 120), cw / 2 - 56, ch * 0.3), n = S.petals.length;
      var gl = ring.querySelectorAll('.ring__glow'), bt = ring.querySelectorAll('.pet');
      for (var i = 0; i < n; i++) {
        var a = off + i * 2 * Math.PI / n, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        if (bt[i]) bt[i].style.transform = 'translate(-50%,-50%) translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
        if (gl[i]) { gl[i].style.left = cx + 'px'; gl[i].style.top = cy + 'px'; gl[i].style.width = (r * 1.35) + 'px'; gl[i].style.transform = 'rotate(' + (a * 180 / Math.PI).toFixed(2) + 'deg)'; }
      }
    }
    function spin(t) { if (!paused && last) { off += (t - last) * 0.000045; place(); } last = t; requestAnimationFrame(spin); }
    ring.addEventListener('pointerover', function (e) { var b = e.target.closest('.pet'); paused = !!b; ring.querySelectorAll('.ring__glow').forEach(function (g, i) { g.classList.toggle('hot', !!b && ring.querySelectorAll('.pet')[i] === b); }); });
    ring.addEventListener('pointerleave', function () { paused = false; ring.querySelectorAll('.ring__glow').forEach(function (g) { g.classList.remove('hot'); }); });
    ring.addEventListener('click', function (e) {
      var b = e.target.closest('.pet'); if (!b) return;
      $('#ai').scrollIntoView({ behavior: K.reduced ? 'auto' : 'smooth', block: 'start' });
      setTimeout(function () { answer(K.t(b.dataset.cat)); }, K.reduced ? 0 : 500);
    });
    new ResizeObserver(place).observe(hero);
    if (!K.reduced) requestAnimationFrame(spin);
    function all() { tones(); sugs(); hello(); pets(); }
    document.addEventListener('kit:lang', all); all();
  }
};
</script>
<script src="../_kit/reel.js"></script>
<script src="../_kit/kit.js"></script>
<script type="module" src="../_kit/kit3d.js"></script>

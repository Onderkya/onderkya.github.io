.hero{position:relative;overflow-x:clip;padding-bottom:10px}
.bub{position:absolute;inset:0;z-index:3;pointer-events:none}
.mach{height:max(78svh,520px);margin:0 10px;border-radius:30px;overflow:hidden}
.mach::after{content:"";position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(6,20,18,.35),transparent 28%,transparent 45%,rgba(6,20,18,.82));pointer-events:none}

.mach__bars{display:flex;gap:6px;margin:14px 0 16px;max-width:420px}
.mach__bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.mach__bars i::after{content:"";display:block;height:100%;background:#fff;transform:scaleX(0);transform-origin:left}
.mach__bars i.done::after{transform:scaleX(1)}
.mach__bars i.on::after{animation:fbar var(--fe,3400ms) linear forwards}
@keyframes fbar{to{transform:scaleX(1)}}
.feat{list-style:none;margin:0;padding:0;display:grid;min-height:2.6em;font-size:clamp(30px,6.4vw,76px)}
.feat li{grid-area:1/1;align-self:end;font-weight:800;line-height:1;letter-spacing:-.035em;max-width:14ch;text-shadow:0 2px 30px rgba(0,0,0,.45);visibility:hidden}
.feat li.on{visibility:visible}
.feat li span{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(8px);transition:opacity .8s var(--ease),transform .8s var(--ease),filter .8s}
.feat li.in span{opacity:1;transform:none;filter:none}
.feat li small{display:block;font-size:max(15px,.27em);font-weight:500;letter-spacing:0;margin-top:.6em;max-width:30ch;opacity:.92}
.mach .k-photo-tag{top:14px;bottom:auto;right:14px;left:auto;z-index:5}
.hero__row{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:end;justify-content:space-between;padding-top:22px}
.hero h1{font-size:clamp(34px,6.4vw,64px);line-height:.98}
.hero h1 span:nth-child(2){color:var(--k-acc)}
.hero p{color:var(--k-muted);margin:8px 0 0;font-weight:500}
.hero__cta{display:flex;gap:10px;flex-wrap:wrap}
.k-btn--line{background:var(--k-surface);border:2px solid var(--k-line);color:var(--k-fg)}

section{padding:72px 0}
.h2{font-size:clamp(36px,7.5vw,72px);line-height:1;text-wrap:balance}
.sub{color:var(--k-muted);margin:8px 0 0}
/* kirli / temiz */
.ba{position:relative;margin-top:26px;border-radius:30px;overflow:hidden;aspect-ratio:4/5;max-height:640px;width:100%;background:#ddd;user-select:none;touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba__dirty{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.ba__dirty::after{content:"";position:absolute;inset:0;background:radial-gradient(70px 52px at 26% 70%,rgba(110,70,25,.75),transparent 70%),radial-gradient(110px 70px at 40% 84%,rgba(140,100,35,.6),transparent 70%),radial-gradient(46px 40px at 18% 58%,rgba(90,55,25,.7),transparent 70%),radial-gradient(160px 110px at 30% 76%,rgba(170,140,70,.35),transparent 70%),linear-gradient(rgba(150,130,90,.28),rgba(150,130,90,.28));mix-blend-mode:multiply}
.ba__dirty img{filter:saturate(.7) brightness(.9) sepia(.25)}
.ba__line{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;margin-left:-1.5px;background:#fff;box-shadow:0 0 12px rgba(0,0,0,.3)}
.ba__line::after{content:"⇆";position:absolute;top:50%;left:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:#fff;color:#13302C;display:grid;place-items:center;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.ba__tag{position:absolute;top:14px;z-index:2;padding:8px 12px;border-radius:99px;font-weight:700;font-size:13px;background:rgba(255,255,255,.9);color:#13302C}
.ba__tag--l{left:14px}.ba__tag--r{right:14px;background:var(--k-acc);color:#fff}
.ba .k-photo-tag{bottom:14px}
@media(min-width:900px){.ba{aspect-ratio:16/9}}
/* süreç */
.steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:26px}
.step{position:relative;border-radius:24px;overflow:hidden;height:260px}
.step b{position:absolute;z-index:3;left:12px;top:12px;width:34px;height:34px;border-radius:50%;background:#fff;color:#13302C;display:grid;place-items:center;font-weight:800}

.items span{padding:10px 16px;border-radius:99px;background:var(--k-surface);border:1.5px solid var(--k-line);font-weight:600}
/* hazır bildirimi */
.ready{background:var(--k-fg);color:var(--k-bg)}

.phone{position:relative;max-width:300px;margin-inline:auto;border-radius:36px;padding:14px;background:#0B1D1B;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}

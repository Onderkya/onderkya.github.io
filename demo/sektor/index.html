<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E0D0C">
<title>Sektör demoları · Onaz Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0D0C;--fg:#F3EEE7;--mut:#A39C92;--line:#2A2724;--acc:#E3B04B;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
header{padding:28px 0 8px;display:flex;justify-content:space-between;align-items:center}
header b{font:800 18px 'Unbounded',sans-serif;letter-spacing:-.01em}
header span{font-size:13px;color:var(--mut)}
h1{font:800 clamp(38px,8vw,92px)/.95 'Unbounded',sans-serif;letter-spacing:-.03em;margin:34px 0 14px;max-width:12ch}
.lede{color:var(--mut);font-size:17px;max-width:46ch;margin:0 0 34px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-bottom:70px}
.card{position:relative;display:block;border-radius:22px;overflow:hidden;background:radial-gradient(120% 80% at 30% 20%,#2b2a35,#0b0b0e);color:#fff;text-decoration:none;aspect-ratio:9/15;isolation:isolate;box-shadow:0 30px 60px -30px rgba(0,0,0,.9),inset 0 0 0 1px rgba(255,255,255,.06)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;z-index:-2;transition:transform 1.2s var(--ease)}
.card::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.88))}
.card:hover img,.card:focus-visible img{transform:scale(1.05)}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.card__b{position:absolute;left:14px;right:14px;bottom:14px}
.card__b small{display:block;font-size:12px;color:#d8d2c8;letter-spacing:.02em}
.card__b strong{display:block;font:800 clamp(17px,2.2vw,24px)/1.1 'Unbounded',sans-serif;margin:4px 0 10px}
.card__b i{font-style:normal;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 12px;border-radius:99px;background:var(--acc);color:#171106}
.card.soon{pointer-events:none;opacity:.55}.card.soon .card__b i{background:#3a3631;color:#d8d2c8}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mut);font-size:13px}
@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header><b>Onaz Studio</b><span>Antalya</span></header>
  <h1>Sektör demoları</h1>
  <p class="lede">Her biri gerçek bir Antalya işletmesi için hazırlandı. Telefonda açın: TR / RU / EN, açık ve koyu tema, WhatsApp’tan gece bile talep.</p>
  <div class="grid" id="grid"></div>
</div>
<footer><div class="wrap">Demo · Onaz Studio. Videolar ve görseller temsilidir (Pexels, Mixkit, Unsplash). İşletme bilgileri herkese açık kaynaklardan.</div></footer>
<script>
/* hazır: true olan açılır, diğerleri "hazırlanıyor" görünür */
var D = [
  ['mobilya-tamiri', 'Mobilya tamiri', 'Erdal Usta Mobilya Tamir', true],
  ['arac-kiralama', 'Rent a car', 'Hascar Rent A Car', true],
  ['berber', 'Erkek kuaförü', 'Tiga Kuaför', true],
  ['guzellik', 'Güzellik merkezi', 'La Beauté', true],
  ['cicekci', 'Çiçekçi', 'Flower Farm Antalya', true],
  ['kuru-temizleme', 'Kuru temizleme', 'Kardelen Organik', true],
  ['telefon', 'Telefon tamiri', 'Cep Atölyesi', true]
];
document.getElementById('grid').innerHTML = D.map(function (d) {
  return '<a class="card' + (d[3] ? '' : ' soon') + '" href="' + (d[3] ? d[0] + '/' : '#') + '"><img src="_prev/' + d[0] + '.jpg" alt="" loading="lazy" width="390" height="844" onerror="this.remove()"><span class="card__b"><small>' + d[2] + '</small><strong>' + d[1] + '</strong><i>' + (d[3] ? 'Demoyu aç' : 'Hazırlanıyor') + '</i></span></a>';
}).join('');
</script>
</body>
</html>

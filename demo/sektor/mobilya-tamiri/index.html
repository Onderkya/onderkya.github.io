<style>
:root{--k-bg:#F4EDE3;--k-fg:#2A1D14;--k-muted:#6F5E50;--k-surface:#FFFAF3;--k-line:#E2D3C0;--k-acc:#B05A2A;--k-acc-fg:#FFF8F0;--walnut:#3B2416;--k-font:'Mulish',system-ui,sans-serif;--k-display:'Literata',Georgia,serif;--k-dock-bg:rgba(244,237,227,.92);--k-btn-radius:14px;--ease:cubic-bezier(.16,1,.3,1)}
[data-theme=dark]{--k-bg:#15100C;--k-fg:#F2E8DC;--k-muted:#B6A391;--k-surface:#1F1812;--k-line:#3A2D22;--k-acc:#DB8A50;--k-acc-fg:#1A0F07;--k-dock-bg:rgba(21,16,12,.92)}
::selection{background:var(--k-acc);color:var(--k-acc-fg)}
.wrap{width:min(1180px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--k-display);font-weight:700;margin:0;letter-spacing:-.02em}
section{padding:80px 0}
.h2{font-size:clamp(34px,6.6vw,70px);line-height:1;max-width:15ch;text-wrap:balance}
.sub{color:var(--k-muted);font-size:17px;max-width:48ch;margin:14px 0 0}
/* üst */
.top{position:absolute;left:0;right:0;top:0;z-index:6;padding:12px 0;color:#F6EEE4}
.top .wrap{display:flex;align-items:center;gap:10px}
.brand{margin-right:auto;text-decoration:none;color:inherit;display:flex;flex-direction:column;line-height:1;min-height:44px;justify-content:center}
.brand b{font:800 22px/1 var(--k-display);letter-spacing:-.01em}
.brand{min-width:0}.brand small{font-size:10px;letter-spacing:.1em;opacity:.8;margin-top:4px;line-height:1.25}
.top .k-langs{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}.top .k-langs button{color:#F6EEE4}.top .k-langs button[aria-pressed=true]{background:#F6EEE4;color:#2A1D14}
.top .k-theme{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);color:#F6EEE4}
/* giriş: atölye hikâyesi */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;color:#F6EEE4;background:#120c08;isolation:isolate;padding:0}
.hero .hero__reel{position:absolute;inset:0;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(18,12,8,.55),transparent 30%,transparent 45%,rgba(18,12,8,.92))}
.hero .reel__bars{top:84px}
.hero__in{padding:0 0 46px}
.hero h1{font-size:clamp(46px,11vw,128px);line-height:.92;max-width:10ch;text-wrap:balance}
.hero h1 em{font-style:italic;font-weight:500;color:#F0B27D}
.hero p.reel__narr{color:#F6EEE4;margin:16px 0 22px}
.hero .reel__narr small{color:#D9C7B5}
.hero__cta{display:flex;flex-wrap:wrap;gap:10px}
.k-btn--ghost{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:#F6EEE4}
@media(min-width:900px){.hero__in{padding-bottom:96px}}
/* imza: koltuğu yenile */
.renew{background:var(--k-bg);position:relative;overflow:hidden}
.renew__grid{display:grid;gap:22px;margin-top:26px}
.stage{position:relative;height:min(62svh,560px);min-height:360px;border-radius:30px;background:radial-gradient(90% 80% at 50% 30%,#fffaf2,#e9dccb);border:1px solid var(--k-line);overflow:hidden}
[data-theme=dark] .stage{background:radial-gradient(90% 80% at 50% 30%,#2b2119,#140f0b)}
.stage__sofa{position:absolute;inset:0}
.stage__tag{position:absolute;left:16px;top:14px;z-index:3;font-size:12px;font-weight:600;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.06);color:var(--k-muted)}
.stage__state{position:absolute;right:16px;top:12px;z-index:3;font:700 14px var(--k-display);padding:7px 12px;border-radius:99px;background:var(--k-fg);color:var(--k-bg);transition:background .4s}
.ctrl{display:flex;flex-direction:column;gap:18px}
.slide{display:grid;gap:10px}
.slide__lab{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:var(--k-muted)}
.slide input{appearance:none;-webkit-appearance:none;width:100%;height:46px;background:transparent;cursor:pointer;touch-action:pan-y}
.slide input::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,#9c8f80,var(--k-acc))}
.slide input::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(90deg,#9c8f80,var(--k-acc))}
.slide input::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-13px;border-radius:50%;background:var(--k-surface);border:3px solid var(--k-acc);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.slide input::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--k-surface);border:3px solid var(--k-acc)}
.slide input:focus-visible{outline:3px solid var(--k-acc);outline-offset:4px;border-radius:12px}
.sw{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.sw button{position:relative;aspect-ratio:1;min-height:44px;border-radius:16px;border:2px solid transparent;background:var(--c);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.07) 0 2px,transparent 2px 4px)}
.sw button[aria-pressed=true]{border-color:var(--k-fg);box-shadow:0 0 0 3px var(--k-bg) inset}
.sw__name{font-weight:700;font-size:15px;margin:0}
.ctrl .k-btn{align-self:flex-start}
.ctrl__note{font-size:13px;color:var(--k-muted);margin:0}
@media(min-width:960px){.renew__grid{grid-template-columns:1.5fr 1fr;align-items:center}.stage{height:min(70svh,620px)}}
/* ne yapıyoruz */
.jobs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:28px}
.job{position:relative;border-radius:22px;overflow:hidden;min-height:230px;background:#000;color:#fff;display:flex;align-items:flex-end;isolation:isolate}
.job>div[data-reel]{position:absolute;inset:0;z-index:-1}
.job::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.82));pointer-events:none}
.job b{display:block;padding:14px;font:700 clamp(17px,2vw,22px)/1.15 var(--k-display);position:relative;z-index:2}
@media(min-width:900px){.jobs{grid-template-columns:repeat(4,1fr)}.job{min-height:340px}}
.small-note{font-size:13px;color:var(--k-muted);margin-top:10px}
/* puan + bulun */
.score{display:inline-flex;align-items:center;gap:12px;margin-top:22px;min-height:44px;color:inherit;text-decoration:none}
.score b{font:800 46px/1 var(--k-display)}
.score span{font-weight:600;color:var(--k-muted)}
.find{display:grid;gap:14px;margin-top:26px}
.find__map{border-radius:26px;overflow:hidden;min-height:300px;border:1px solid var(--k-line)}
.find__row{display:flex;flex-wrap:wrap;gap:10px}.find__row .k-btn{flex:1 1 180px}
.k-btn--line{background:var(--k-surface);border:1.5px solid var(--k-line);color:var(--k-fg)}
footer{padding:30px 0 100px;border-top:1px solid var(--k-line)}
footer .wrap{display:flex;flex-direction:column;gap:4px}

  onReady: function (K) {
    var $ = K.$, sofa = $('#sofa'), age = $('#age'), sw = $('#sw'), state = $('#state'), S = SITE, cur = S.fabrics[0], touched = false;
    function paintSw() {
      sw.innerHTML = S.fabrics.map(function (f) { return '<button type="button" style="--c:' + f[1] + '" data-fab="' + f[0] + '" aria-pressed="' + (f === cur) + '" aria-label="' + K.t(f[0]) + '"></button>'; }).join('');
      $('#swname').textContent = K.t(cur[0]);
    }
    function setAge(v) { age.value = v; sofa.setAttribute('data-age', (1 - v / 100).toFixed(3)); state.textContent = K.t(v > 55 ? 'st_new' : 'st_old'); }
    age.addEventListener('input', function () { touched = true; setAge(+age.value); });
    sw.addEventListener('click', function (e) {
      var b = e.target.closest('[data-fab]'); if (!b) return;
      cur = S.fabrics.filter(function (f) { return f[0] === b.dataset.fab; })[0]; sofa.setAttribute('data-color', cur[1]); paintSw();
      if (+age.value < 80) setAge(100);
    });
    $('#rn-send').addEventListener('click', function () {
      K.openFlow('fix', { fabric: 'fa2', note: K.t(cur[0]) });
    });
    /* görünür olunca eski → yeni kendiliğinden geçsin; dokunulmadıysa ara ara tekrarlasın */
    var running = false;
    function play(from, to, ms, done) {
      if (K.reduced) { setAge(to); return; }
      var t0 = performance.now(); running = true;
      (function f(now) { var p = Math.min(1, (now - t0) / ms), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; if (!touched) setAge(from + (to - from) * e); if (p < 1 && !touched) requestAnimationFrame(f); else { running = false; if (done) done(); } })(t0);
    }
    var loop = null;
    new IntersectionObserver(function (es) {
      if (es[0].isIntersecting && !running && !touched) {
        play(0, 100, 2600);
        clearInterval(loop); loop = setInterval(function () { if (touched || running) return; play(100, 0, 1400, function () { setTimeout(function () { play(0, 100, 2200); }, 700); }); }, 9000);
      } else if (!es[0].isIntersecting) clearInterval(loop);
    }, { threshold: 0.4 }).observe(sofa);
    setAge(0); paintSw();
    document.addEventListener('kit:lang', function () { paintSw(); setAge(+age.value); });
  }
};
